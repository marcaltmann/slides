## 1
### Media Management Tool

--

### Was ist MMT?

<br />

- Wofür? „Preproduction“. Nutzende wollen Videos und Audios…
  - auf dem oh.d-Interview-Portal einstellen
  - transkribieren
  - transkodieren (kleinere Web-taugliche Versionen erzeugen)
  - anonymisieren (Audio an bestimmten Stellen „muten“)
- Ursprünglich ein von uns entwickeltes NodeJS-Tool zum Upload von großen Mediendateien (bis 70GB)
- Seit zwei Jahren in Python/Django neu entwickelt, mit einigen neuen Funktionen.

### Architektur und Entwicklung

- Python everything
- keine Single Page Application
- Docker
- Spec-driven Development mit AI (seit 4 Monaten)

### Details einzelne Services

--

#### Django-App

- Django-Webapp (Docker-Container 1)
- Celery für long running tasks (Docker-Container 2)
- Django-Admin für Verwaltung
- MySQL-Datenbank
- Vue.js für einzelne Frontend-Komponenten (Upload, Transkript-Editor)

--

#### ASR-Service

- FastAPI-Service (als Docker-Container)
- ASR mit WhisperX
- Transcription, Forced Alignment für Word Timestamps, Speaker Diarization
- multilingual (30 Sprachen)
- GPU

--

#### NER-Service

- FastAPI-Service (als Docker-Container)
- NER mit Gliner2
- multilinguale NER
- CPU-only
