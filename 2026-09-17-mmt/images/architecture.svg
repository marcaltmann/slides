<title>IT-Architektur: Django-App mit zwei FastAPI-Diensten</title>
<desc>Ein Client greift auf eine Django-App zu, die eine MySQL-Datenbank nutzt und per HTTP zwei FastAPI-Dienste für Entitätenerkennung und Spracherkennung aufruft.</desc>
